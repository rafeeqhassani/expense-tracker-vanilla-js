<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section class="app-header">
        <h1>Expense Tracker</h1>
        <div class="summary">
          <div class="row">
            <span>Total:</span>
            <span id="totalAmount">0</span>
          </div>
          <div class="row">
            <span>Monthly: </span>
            <span id="monthlyTotal">0</span>
          </div>
        </div>
        <button id="openForm" class="open-form">Add new expense</button>
      </section>

      <section class="filters">
        <div class="field">
          <label for="searchExpenses">Search</label>
          <input
            type="text"
            id="searchExpenses"
            name="title"
            placeholder="Search by title..."
          />
        </div>
        <div class="field">
          <label for="filterByMonth">Filter by month</label>
          <select id="filterByMonth" name="month">
            <option value="all">All Months</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div class="field">
          <label for="sortSelection">Sort by </label>
          <select id="sortSelection" name="sortBy">
            <option value="latest">Date: Newest &#8594; Oldest</option>
            <option value="smallest">Amount: Smallest &#8594; Largest</option>
            <option value="largest">Amount: Largest &#8594; Smallest</option>
            <option value="title-ascending">Title: A &#8594; Z</option>
            <option value="title-descending">Title: Z &#8594; A</option>
          </select>
        </div>
      </section>

      <section id="cardContainer" class="list-container"></section>

      <section class="actions-bar">
        <div class="left">
          <button type="button" id="loadMore" class="hidden">Load more</button>
        </div>
        <p id="loadMoreMessage" class="message"></p>
        <div class="right">
          <button type="button" id="clearSelected">Clear selected</button>
          <button type="button" id="clearAll">Clear all</button>
        </div>
      </section>
    </main>

    <div class="modal hidden">
      <form id="expenseForm">
        <div class="field">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="Add Expense"
          />
          <small class="validate-title"></small>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            placeholder="e.g. 100.00"
          />
          <small class="validate-amount"></small>
        </div>

        <div class="category-field">
          <div class="input-group">
            <div class="field">
              <label for="selectCategory">Select category</label>
              <select id="selectCategory" name="category"></select>
            </div>
            <div class="field">
              <label for="customCategory">Category</label>
              <input
                type="text"
                id="customCategory"
                name="customCategory"
                class="category-input"
                placeholder="Enter custom category"
              />
            </div>
          </div>

          <small class="validate-category"></small>
        </div>

        <div class="field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput" name="date" />
          <small class="validate-date"></small>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-button">Add/Update</button>
          <button type="button" id="closeForm" class="close-form">
            Close form
          </button>
        </div>
      </form>
    </div>

    <div id="toastContainer"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
